<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCM Dashboard</title>
    <!-- Local dev fallback — this value is never used in production because
         /config.js (generated fresh on every container start) overrides it. -->
    <script>
      window.__APP_CONFIG__ = { API_BASE_URL: "__API_BASE_URL__" };
    </script>
    <!-- Production runtime config generated by docker-entrypoint.sh.
         onerror silences the 404 during local `vite dev` (no container = no file). -->
    <script src="/config.js" onerror="void 0"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
