global:
  scrape_interval: 15s

scrape_configs:
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - inventory-service:2502
  - job_name: warehouse-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - warehouse-service:2504
