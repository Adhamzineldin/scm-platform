spring.application.name=api-gateway
server.port=${SERVER_PORT:7080}

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=false

# JWT shared secret (must match auth-service jwt.secret). Override via env in production.
jwt.secret=${JWT_SECRET:logisticsSecretKeyForJwtMustBeLongEnough123456789}

# Allow long-lived streams (SSE) to pass through without buffering / early close
spring.cloud.gateway.streaming-media-types=text/event-stream,application/stream+json
server.tomcat.connection-timeout=0
spring.mvc.async.request-timeout=-1

# Multipart: must be large enough to forward profile picture uploads to auth-service
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Actuator (Prometheus scrape endpoint)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

