<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Status Update</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .header { background-color: #1a1a2e; color: white; padding: 15px; text-align: center; border-radius: 8px 8px 0 0; }
        .status-box { background-color: #f4f4f4; padding: 15px; border-left: 4px solid #1a1a2e; margin-top: 15px; }
        .status-label { color: #888; font-size: 12px; text-transform: uppercase; }
        .status-value { font-size: 18px; font-weight: bold; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Order Status Update</h2>
    </div>
    <div class="content">
        <p>Hello <span th:text="${customerName}">Customer</span>,</p>
        <p>Your order <strong>#<span th:text="${orderId}">123</span></strong> has been updated.</p>

        <div class="status-box">
            <div>
                <span class="status-label">Previous status:</span>
                <span th:text="${previousStatus}">CREATED</span>
            </div>
            <div style="margin-top: 8px;">
                <span class="status-label">New status:</span>
                <span class="status-value" th:text="${newStatus}">PICKED</span>
            </div>
            <div style="margin-top: 8px;">
                <span class="status-label">Updated at:</span>
                <span th:text="${changedAt}">2026-04-17T10:00:00Z</span>
            </div>
        </div>

        <p style="margin-top: 20px;">We'll let you know as soon as it moves again.</p>
    </div>
</div>
</body>
</html>
