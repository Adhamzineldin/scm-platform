<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .header { background-color: #1a1a2e; color: white; padding: 15px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px 0; }
        .item-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .item-table th, .item-table td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Order Confirmation</h2>
    </div>
    <div class="content">
        <p>Hello <span th:text="${customerName}">Customer</span>,</p>
        <p>Thank you for your order! Your order <strong>#<span th:text="${orderId}">123</span></strong> has been successfully placed.</p>

        <h3>Shipping To:</h3>
        <p th:text="${shippingAddress}">123 Main St</p>

        <h3>Order Summary:</h3>
        <table class="item-table">
            <thead>
            <tr>
                <th>SKU</th>
                <th>Qty</th>
                <th>Price</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.sku()}">SKU-001</td>
                <td th:text="${item.quantity()}">1</td>
                <td th:text="'$' + ${item.unitPrice()}">$10.00</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
