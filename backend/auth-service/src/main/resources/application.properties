spring.application.name=auth-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/logistics_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

server.port=${SERVER_PORT:8081}
jwt.secret=${JWT_SECRET:logisticsSecretKeyForJwtMustBeLongEnough123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Bootstrap admin (created on first startup if no ADMIN exists)
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@scm.local}
admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:admin}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@12345}

# Mail (OTP emails for registration 2FA)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:Adhams.Botmail@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:tkfp vsuh kybi jwbh}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
