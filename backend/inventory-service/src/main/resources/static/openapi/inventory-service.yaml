openapi: 3.0.3
info:
  title: Inventory Service API
  version: 1.0.0
  description: Contract for product catalog and stock operations in the SCM platform.
servers:
  - url: http://localhost:2502
paths:
  /api/products:
    post:
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Invalid request
        '409':
          description: Duplicate SKU
    get:
      summary: Get all products
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
  /api/products/{id}:
    get:
      summary: Get product by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
    put:
      summary: Update product by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Invalid request
        '404':
          description: Product not found
        '409':
          description: Duplicate SKU
    delete:
      summary: Delete product by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Product deleted
        '404':
          description: Product not found
  /api/products/sku/{sku}:
    get:
      summary: Get product by SKU
      parameters:
        - in: path
          name: sku
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
  /api/inventory/check:
    get:
      summary: Check whether stock is available for a single SKU
      parameters:
        - in: query
          name: sku
          required: true
          schema:
            type: string
        - in: query
          name: quantity
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Stock availability result
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Invalid request
        '404':
          description: Product not found
  /api/inventory/status:
    get:
      summary: Get stock status for a single SKU
      parameters:
        - in: query
          name: sku
          required: true
          schema:
            type: string
        - in: query
          name: quantity
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Stock status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCheckResponse'
        '400':
          description: Invalid request
        '404':
          description: Product not found
  /api/inventory/bulk-check:
    post:
      summary: Check stock for multiple items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StockReservationRequest'
      responses:
        '200':
          description: List of SKUs that failed the stock check
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Invalid request
        '404':
          description: Product not found
  /api/inventory/bulk-reserve:
    post:
      summary: Reserve stock for multiple items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StockReservationRequest'
      responses:
        '200':
          description: Empty list on success or failed SKUs on insufficient stock
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Invalid request
        '404':
          description: Product not found
components:
  schemas:
    ProductRequest:
      type: object
      required:
        - sku
        - name
        - quantity
        - unitPrice
        - reorderLevel
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        quantity:
          type: integer
          minimum: 0
        unitPrice:
          type: number
          format: double
          exclusiveMinimum: 0
        reorderLevel:
          type: integer
          minimum: 0
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        reorderLevel:
          type: integer
        lowStock:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StockReservationRequest:
      type: object
      required:
        - sku
        - quantity
        - unitPrice
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: double
          exclusiveMinimum: 0
    StockCheckResponse:
      type: object
      properties:
        sku:
          type: string
        requestedQuantity:
          type: integer
        availableQuantity:
          type: integer
        inStock:
          type: boolean
