services:
  # ─────────────────────────── Infrastructure ───────────────────────────
  # All local infra is in the `local` profile. To run in AWS-mode (RDS/MSK/SES)
  # simply DON'T activate this profile and use the .aws.yml overlay.
  #   Local : docker compose --profile local up -d
  #   AWS   : docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d
  postgres:
    image: postgres:15
    profiles: ["local"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logistics_db
    ports:
      - "5434:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d logistics_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    profiles: ["local"]
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    profiles: ["local"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    profiles: ["local"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui
    profiles: ["local"]
    depends_on:
      - kafka
    ports:
      - "9999:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ─────────────────────────── Service Discovery ───────────────────────────
  discovery-server:
    build:
      context: ./backend/discovery-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────── API Gateway ───────────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "7080:7080"
    environment:
      SERVER_PORT: 7080
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      EUREKA_CLIENT_ENABLED: "true"
      JWT_SECRET: logisticsSecretKeyForJwtMustBeLongEnough123456789

  # ─────────────────────────── Domain Services ───────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: logisticsSecretKeyForJwtMustBeLongEnough123456789
      JWT_EXPIRATION: 86400000
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      EUREKA_CLIENT_ENABLED: "true"

  cart-service:
    build:
      context: ./backend/cart-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cart_db
      DB_USERNAME: admin
      DB_PASSWORD: password
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      EUREKA_CLIENT_ENABLED: "true"

  inventory-service:
    build:
      context: ./backend/inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "2502:2502"
    environment:
      SERVER_PORT: 2502
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      EUREKA_CLIENT_ENABLED: "true"

  order-service:
    build:
      context: ./backend/order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
      inventory-service:
        condition: service_started
      warehouse-service:
        condition: service_started
    ports:
      - "2501:2501"
    environment:
      SERVER_PORT: 2501
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scm_order_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVENTORY_SERVICE_URL: http://inventory-service:2502
      WAREHOUSE_SERVICE_URL: http://warehouse-service:2504
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      EUREKA_CLIENT_ENABLED: "true"

  shipment-service:
    build:
      context: ./backend/shipment-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
    ports:
      - "2503:2503"
    environment:
      SERVER_PORT: 2503
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scm_shipment_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      EUREKA_CLIENT_ENABLED: "true"

  warehouse-service:
    build:
      context: ./backend/warehouse-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "2504:2504"
    environment:
      SERVER_PORT: 2504
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scm_warehouse_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      ORDER_SERVICE_URL: http://order-service:2501
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      EUREKA_CLIENT_ENABLED: "true"

  notification-service:
    build:
      context: ./backend/notification-service
    depends_on:
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
    ports:
      - "2505:2505"
    environment:
      SERVER_PORT: 2505
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_USERNAME: Adhams.Botmail@gmail.com
      SPRING_MAIL_PASSWORD: tkfp vsuh kybi jwbh
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      EUREKA_CLIENT_ENABLED: "true"

  document-gen-service:
    build:
      context: ./backend/document-gen-service
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "3050:3050"
    environment:
      PORT: 3050
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      EUREKA_SERVER: http://discovery-server:8761

  # ─────────────────────────── Frontend ───────────────────────────
  dashboard:
    build:
      context: ./frontend/dashboard
    depends_on:
      - api-gateway
    ports:
      - "5173:80"
    environment:
      # Browser -> gateway. On AWS set this to https://api.your-domain.com
      API_BASE_URL: ${API_BASE_URL:-http://localhost:7080}

  # ─────────────────────────── Observability ───────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["local"]
    depends_on:
      - api-gateway
      - auth-service
      - cart-service
      - order-service
      - inventory-service
      - shipment-service
      - warehouse-service
      - notification-service
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["local"]
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
